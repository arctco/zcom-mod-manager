[package]
name = "zcom-mod-manager"
version = "0.5.0"
description = "A dedicated mod manager for Star Wars: Zero Company"
authors = ["Victor Hugo (arctco)"]
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/arctco/zcom-mod-manager"

[lib]
name = "zcom_mod_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
# Nexus Mods indexes uploaded files by MD5, which is the only way to identify
# a mod that was installed before its provenance was recorded.
md-5 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate", "bzip2", "zstd"] }
dirs = "6"
regex = "1"
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-single-instance = "2.4.3"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
tokio = { version = "1.53.1", features = ["fs", "io-util"] }
keyring = "4.1.6"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "stream", "http2", "charset"] }

[dev-dependencies]
tempfile = "3"
