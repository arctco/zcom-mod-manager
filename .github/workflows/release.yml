name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            args: --bundles appimage,deb
          - os: windows-2025
            args: --bundles nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf p7zip-full
      - run: npm ci
      - name: Prepare verified retoc sidecar
        if: runner.os == 'Linux'
        run: npm run prepare:retoc
      - name: Prepare verified retoc sidecar
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/prepare-retoc.ps1
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_STRIP: ${{ runner.os == 'Linux' && '1' || '' }}
        with:
          projectPath: .
          tagName: ${{ github.ref_name }}
          releaseName: ZCOM Mod Manager ${{ github.ref_name }}
          releaseBody: See CHANGELOG.md for release notes. Community builds are unsigned.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
      - name: Package portable Windows zip
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $release = "src-tauri/target/release"
          $exe = Get-Item (Join-Path $release "ZCOM Mod Manager.exe")
          $retoc = Get-ChildItem $release -Filter "retoc*.exe" | Select-Object -First 1
          if (-not $retoc) { throw "retoc sidecar not found in $release" }
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $stage = Join-Path $env:RUNNER_TEMP "portable"
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item $exe.FullName $stage
          Copy-Item $retoc.FullName (Join-Path $stage "retoc.exe")
          Copy-Item LICENSE, README.md, THIRD_PARTY_NOTICES.md $stage
          $asset = Join-Path $env:RUNNER_TEMP "ZCOM.Mod.Manager_${version}_x64-portable.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $asset -Force
          gh release upload "${{ github.ref_name }}" "$asset" --clobber
      - name: Repack AppImage without host-provided Wayland libraries
        if: runner.os == 'Linux'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          appimage="$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          bash scripts/fix-appimage.sh "$appimage"
          asset="$RUNNER_TEMP/$(basename "$appimage" | tr ' ' '.')"
          cp "$appimage" "$asset"
          gh release upload "${{ github.ref_name }}" "$asset" --clobber
